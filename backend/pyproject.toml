[project]
name = "wellness-companion-backend"
version = "1.0.0"
description = "FastAPI backend for the AI Companion for Emotional Wellness & Self-Reflection (IT 7993 Capstone, Team P05-01)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Make the app package importable when running pytest from this directory.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Deprecation notice from Starlette's TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI dependencies in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # asserts, test secrets, long lines
